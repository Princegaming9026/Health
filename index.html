<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move File System</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffcc00, #ff3300);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 2em;
            text-shadow: 2px 2px 4px black;
        }
        button {
            background: linear-gradient(45deg, #ff0000, #0000ff);
            color: white;
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }
        button:hover {
            background: linear-gradient(45deg, #0000ff, #ff0000);
        }
    </style>
</head>
<body>

    <h1>File Move System</h1>
    <button onclick="moveFile('on')">ON</button>
    <button onclick="moveFile('off')">OFF</button>

    <script>
        function moveFile(action) {
            fetch("move_file.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: action })
            })
            .then(response => response.text())
            .then(data => alert(data))
            .catch(error => alert("Error: " + error));
        }
    </script>

</body>
</html>
