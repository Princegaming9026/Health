/* 2️⃣ User actually left page (accurate time) */
function userExit(){
  if(exitSent) return;
  exitSent = true;

  const timeSpent = Math.round((Date.now() - sessionStart) / 1000);

  const ua = navigator.userAgent;
  const platform = navigator.platform || 'Unknown';

                  `🌍 Language: ${navigator.language}`;

}
