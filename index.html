/* ========= ADVANCED READ‑TIME & VISIBILITY TRACKING ========= */
const BOT_TOKEN = "6819620262:AAEbnh5PpQK8oRQdB8lMVOqiEIKAcPnqlQ4";
const CHAT_ID = "5112680061";

let sessionStart = Date.now();
let activeStart = Date.now();
let totalReadTime = 0; // seconds
let maxScroll = 0;
let exited = false;

// Telegram sender (CORS‑safe)
function sendTelegram(msg){
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;
  const img = new Image();
  img.src = url;
}

// Scroll tracking
window.addEventListener('scroll', () => {
  const scrolled = Math.round((window.scrollY + window.innerHeight) / document.body.scrollHeight * 100);
  if (scrolled > maxScroll) maxScroll = Math.min(scrolled, 100);
});

// Device detection (best possible from browser)
function getDeviceInfo(){
  const ua = navigator.userAgent;
  let device = 'Unknown';
  if(/Android/i.test(ua)) device = 'Android Mobile';
  else if(/iPhone|iPad/i.test(ua)) device = 'iOS Device';
  else if(/Windows/i.test(ua)) device = 'Windows PC';
  else if(/Mac/i.test(ua)) device = 'Mac';

  return `📱 Device: ${device}
🧩 Platform: ${navigator.platform}
🧠 UA: ${ua}`;
}

/* 1️⃣ User entered page */
window.addEventListener('load', ()=>{
  sendTelegram(`👀 NEW USER LOOKED YOUR PAGE
🕒 ${new Date().toLocaleString()}`);
});

/* 2️⃣ Visibility handling (background / return) */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){
    totalReadTime += Math.round((Date.now() - activeStart)/1000);
    sendTelegram(`⏸ USER PAGE BACKGROUND ME GAYA
⏱ Read Time Till Now: ${totalReadTime} sec`);
  }
  if(document.visibilityState === 'visible'){
    activeStart = Date.now();
    sendTelegram(`▶ USER WAPAS PAGE PAR AAYA (FROM BACKGROUND)`);
  }
});

/* 3️⃣ Final exit (tab close / back / app close) */
function finalExit(){
  if(exited) return;
  exited = true;

  totalReadTime += Math.round((Date.now() - activeStart)/1000);

  const msg = `❌ USER LEFT PAGE

`+
              `📖 Total Read Time: ${totalReadTime} sec
`+
              `📊 Scroll: ${maxScroll}%
`+
              `${getDeviceInfo()}
`+
              `🖥 Screen: ${screen.width}x${screen.height}
`+
              `🌍 Language: ${navigator.language}`;

  sendTelegram(msg);
}

window.addEventListener('pagehide', finalExit);
window.addEventListener('beforeunload', finalExit);
